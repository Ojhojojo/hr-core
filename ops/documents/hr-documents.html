<ops-page-header
  title="Documents"
  infoTooltip="Offer and COE stay in Directory; workshop forms stay on Forms."
>
  <a actions matButton="outlined" routerLink="/hr/employee-directory">Open Directory</a>
</ops-page-header>

<div class="ops-table-wrap">
  <table mat-table [dataSource]="templates" class="mat-elevation-z0 ops-table">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Template</th>
      <td mat-cell *matCellDef="let row" data-label="Template">{{ row.title }}</td>
    </ng-container>
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row" data-label="Description">{{ row.description }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row" data-label="Status">
        <ops-status-badge
          [tone]="row.status === 'available' ? 'ok' : 'neutral'"
          [label]="row.status === 'available' ? 'Available' : 'Coming soon'"
          [attr.data-state]="row.status"
        />
      </td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef></th>
      <td
        mat-cell
        *matCellDef="let row"
        class="ops-td-actions"
        data-label=""
        (click)="$event.stopPropagation()"
        (keydown.enter)="$event.stopPropagation()"
      >
        @if (row.status === 'available') {
          <button
            matButton="text"
            type="button"
            [attr.name]="'generate-' + row.id"
            (click)="open(row)"
          >
            Generate
          </button>
        }
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: columns"
      [attr.data-template]="row.id"
      [class.ops-row-link]="row.status === 'available'"
      [attr.tabindex]="row.status === 'available' ? 0 : null"
      (click)="open(row)"
      (keydown.enter)="open(row)"
    ></tr>
  </table>
</div>
